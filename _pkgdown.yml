url: https://gillescolling.com/spacc/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  math-rendering: mathjax
  includes:
    in_header: pkgdown/mathjax-config.html
figures:
  dev: svglite
  fig.ext: svg
  bg: '#F5F6F8'
home:
  title: spacc
  description: Fast Spatial Species Accumulation Curves
navbar:
  structure:
    left:
    - intro
    - articles
    - reference
    - news
    right:
    - search
    - github
    - lightswitch
  components:
    github:
      icon: fab fa-github
      href: https://github.com/gcol33/spacc
articles:
- title: Getting Started
  navbar: Getting Started
  contents: quickstart
- title: Practical Guides
  navbar: Guides
  contents:
  - diversity
  - extrapolation
  - spatial-analysis
- title: Advanced Topics
  navbar: Advanced
  contents:
  - richness-estimation
  - community-assembly
  - rarefaction-standardization
